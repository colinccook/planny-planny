name: PR Unit Tests

# Runs the fast Vitest unit suite on every pull request targeting main.
# The heavier Playwright BDD suites and the deploy chain run in
# ci-deploy.yml on pushes to main.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
