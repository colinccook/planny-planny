<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      `user-scalable=no` + `maximum-scale=1` disables pinch-to-zoom across the
      app. Without this, pinching the sticky header (or any other fixed
      element) zooms the viewport and visibly breaks the mobile-first layout.
      Planny Planny is a chrome-free PWA-style web app where pinch-zoom isn't a
      useful gesture, so we opt out of it explicitly.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <title>planny-planny</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // iOS Safari ignores `user-scalable=no` in the viewport meta and will
      // still pinch-zoom the page (a regression that has been open for years).
      // Cancelling the `gesture*` events at the document level — which only
      // fire on iOS Safari — completes the pinch-to-zoom block. The viewport
      // meta above handles every other browser.
      document.addEventListener('gesturestart', (e) => e.preventDefault())
      document.addEventListener('gesturechange', (e) => e.preventDefault())
      document.addEventListener('gestureend', (e) => e.preventDefault())
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // %BASE_URL% is replaced by Vite at build time and matches the
          // configured `base` (e.g. `/planny-planny/` on GitHub Pages, `/` at
          // an apex domain). Keeping the SW URL and scope aligned with the app
          // base means the share/invite links and offline cache always live
          // under the same origin path.
          navigator.serviceWorker.register('%BASE_URL%sw.js', { scope: '%BASE_URL%' })
        })
      }
    </script>
  </body>
</html>
