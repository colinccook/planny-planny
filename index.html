<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <title>planny-planny</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // %BASE_URL% is replaced by Vite at build time and matches the
          // configured `base` (e.g. `/planny-planny/` on GitHub Pages, `/` at
          // an apex domain). Keeping the SW URL and scope aligned with the app
          // base means the share/invite links and offline cache always live
          // under the same origin path.
          navigator.serviceWorker.register('%BASE_URL%sw.js', { scope: '%BASE_URL%' })
        })
      }
    </script>
  </body>
</html>
