<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      We deliberately do NOT set `maximum-scale=1` / `user-scalable=no`
      here. Those flags block pinch-to-zoom on every browser that honours
      them (Android Chrome, Firefox, etc.) which is an accessibility
      regression for low-vision users — and they don't actually fix the
      iOS-Safari sticky-header pinch bug we're trying to address (Safari
      ignores them). The iOS-specific `gesturestart` handler at the
      bottom of `<body>` does the real work.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <title>planny-planny</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // iOS Safari ignores `user-scalable=no` in the viewport meta and will
      // still pinch-zoom the page, which on a chrome-free PWA-style layout
      // visibly distorts the sticky header (the user-reported bug).
      // Cancelling the `gesture*` events at the document level — which only
      // fire on iOS Safari — fixes that one symptom on that one browser.
      //
      // Accessibility note: this disables pinch-zoom on iOS Safari only.
      // Every other browser keeps full zoom support thanks to the relaxed
      // viewport meta above. iOS users who need to magnify can still use
      // Settings → Accessibility → Zoom (system-level magnifier).
      document.addEventListener('gesturestart', (e) => e.preventDefault())
      document.addEventListener('gesturechange', (e) => e.preventDefault())
      document.addEventListener('gestureend', (e) => e.preventDefault())
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // %BASE_URL% is replaced by Vite at build time and matches the
          // configured `base` (e.g. `/planny-planny/` on GitHub Pages, `/` at
          // an apex domain). Keeping the SW URL and scope aligned with the app
          // base means the share/invite links and offline cache always live
          // under the same origin path.
          navigator.serviceWorker.register('%BASE_URL%sw.js', { scope: '%BASE_URL%' })
        })
      }
    </script>
  </body>
</html>
